name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q JARVIS_PhoneBuild.zip -d buildsrc
          test -f buildsrc/JARVIS_PhoneBuild/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JARVIS APK
        working-directory: buildsrc/JARVIS_PhoneBuild
        run: gradle --no-daemon assembleDebug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: buildsrc/JARVIS_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
