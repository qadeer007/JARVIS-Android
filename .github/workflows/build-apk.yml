name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -o JARVIS_PhoneBuild.zip -d buildsrc
          echo "Extracted files:"
          find buildsrc -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JARVIS APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
